name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JSON manifests
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            for (const file of ["orca-plugin.json", "package.json", "VALIDATION.json"]) {
              const parsed = JSON.parse(fs.readFileSync(file, "utf8"));
              if (!parsed) throw new Error(`Invalid JSON: ${file}`);
            }
            const manifest = JSON.parse(fs.readFileSync("orca-plugin.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (manifest.version !== pkg.version) {
              throw new Error(`Version mismatch: orca-plugin.json (${manifest.version}) !== package.json (${pkg.version})`);
            }
          '

      - name: Run unit & SQLite integration tests
        run: npm test
