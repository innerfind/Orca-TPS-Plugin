<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TPS Plugin</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f2f2f7;
      --surface: #ffffff;
      --ink: #1c1c1e;
      --muted: #6d6d75;
      --line: #e5e5ea;
      --purple: #8f32d6;
      --blue: #0066e6;
      --orange: #b45300;
      --green: #007f48;
      --cache: #9c6500;
      --speed: #c72e3a;
      --speed-bg: #f0f0f3;
      --tag-bg: #ededf2;
      --heat-0: #ebedf0; --heat-1: #bfdbfe; --heat-2: #7fb6fb; --heat-3: #3b82e6; --heat-4: #1d4fb8;
      --proxy-bg: #e5f7ee;
      --button-bg: #e5f0ff;
      --warning-bg: #fff1dc;
      --error: #c8213a;
      --error-bg: #fff0f3;
      --shadow: 0 3px 12px rgb(39 43 72 / 3%);
    }
    html.dark {
      color-scheme: dark;
      --page: #161618;
      --surface: #262628;
      --ink: #f5f5f7;
      --muted: #b4b4be;
      --line: #3a3a3e;
      --purple: #d38aff;
      --blue: #64b0ff;
      --orange: #ffb340;
      --green: #4ade80;
      --cache: #e8b65b;
      --speed: #ff6b72;
      --speed-bg: #303034;
      --tag-bg: #343439;
      --heat-0: #2a2a2e; --heat-1: #1e3a5f; --heat-2: #2e5f94; --heat-3: #4a8fd6; --heat-4: #8cc4ff;
      --proxy-bg: #193829;
      --button-bg: #163552;
      --warning-bg: #46321b;
      --error: #ff8fa5;
      --error-bg: #49232d;
      --shadow: 0 3px 12px rgb(0 0 0 / 6%);
    }
    * { box-sizing: border-box; }
    /* Set the reading direction on text leaves so flex and grid keep their order. */
    :where(html:lang(ar), html:lang(ur)) :is([data-i18n], [data-localized-text]) {
      direction: rtl;
      unicode-bidi: isolate;
      text-align: match-parent;
    }
    [hidden] { display: none !important; }
    html { min-width: 0; min-height: 100%; background: var(--page); }
    body {
      margin: 0;
      min-width: 0;
      padding: 16px;
      color: var(--ink);
      background: var(--page);
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel-summary { min-width: 0; }
    h1 { margin: 0; font-size: 18px; line-height: 1.4; letter-spacing: -.3px; font-weight: 750; }
    .title-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 32px; }
    .language-picker { position: relative; min-width: 0; }
    .language-toggle, .language-option {
      display: flex; align-items: center; gap: 7px; min-width: 0; min-height: 32px;
      padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface); color: var(--ink); cursor: pointer;
    }
    .language-toggle { max-width: 100%; }
    .language-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .language-flag { flex: none; width: 20px; height: 14px; object-fit: contain; }
    .language-toggle svg { flex: none; width: 12px; height: 12px; color: var(--muted); }
    .language-menu {
      position: absolute; z-index: 4; top: calc(100% + 5px); right: 0;
      width: min(216px, calc(100vw - 32px)); padding: 6px;
      border: 1px solid var(--line); border-radius: 10px;
      background: var(--surface); box-shadow: 0 5px 18px rgb(0 0 0 / 15%);
    }
    .language-search {
      width: 100%; padding: 6px 8px; margin-bottom: 4px;
      border: 1px solid var(--line); border-radius: 6px;
      font: inherit; color: var(--ink); background: var(--page);
    }
    .language-toggle:focus-visible, .language-option:focus-visible, .language-search:focus-visible {
      outline: 2px solid var(--blue); outline-offset: 1px;
    }
    .language-options { max-height: 238px; overflow-y: auto; }
    .language-option { width: 100%; border-color: transparent; text-align: start; }
    .language-option:hover, .language-option[aria-pressed="true"] { background: var(--button-bg); color: var(--blue); }
    .language-message { margin: 4px 6px; color: var(--muted); overflow-wrap: anywhere; }
    .summary { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .refresh {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      flex-shrink: 0; min-height: 34px; padding: 7px 11px; border: 0; border-radius: 13px;
      background: var(--button-bg); color: var(--blue); font-size: 12px; font-weight: 650; cursor: pointer;
    }
    .refresh svg { width: 14px; height: 14px; flex-shrink: 0; }
    .refresh:hover:not(:disabled) { filter: brightness(.96); }
    .refresh:active:not(:disabled) { transform: translateY(1px); }
    .refresh:disabled { cursor: default; opacity: .6; }
    .refresh:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    .panel-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 10px; border-bottom: 1px solid var(--line); }
    .panel-tab { min-width: 0; padding: 8px 2px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font-weight: 650; cursor: pointer; }
    .panel-tab[aria-selected="true"] { border-bottom-color: var(--blue); color: var(--blue); }
    .panel-tab:focus-visible, .panel-view:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .panel-view { margin-top: 12px; }
    #usage, #leaderboard { display: grid; gap: 8px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 2px 8px; }
    .section-title { margin: 0; color: var(--ink); font-size: 13px; line-height: 1.6; font-weight: 700; }
    .section-detail { margin: 0; color: var(--muted); font-size: 11px; }
    .ladder-card { padding: 12px 16px; }
    .ladder-refresh-time { font-variant-numeric: tabular-nums; }
    .ladder-tabs { margin-top: 6px; }
    .ladder-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
    .ladder-control { min-height: 36px; padding-inline: 12px; font-size: 13px; font-weight: 700; }
    .ladder-secondary { color: var(--muted); background: var(--tag-bg); }
    .ladder-primary { color: var(--surface); background: var(--blue); }
    .ladder-note { margin: 6px 0 0; color: var(--muted); font-size: 11px; }
    .ladder-actions .ladder-note { margin: 0; }
    .ladder-status { margin: 8px 0 0; font-size: 12px; overflow-wrap: anywhere; }
    .ladder-status:empty, .ladder-mine:empty { display: none; }
    .ladder-identity { display: flex; justify-content: space-between; gap: 8px; align-items: center; min-width: 0; }
    .ladder-user-grid, .ladder-badges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 8px; }
    .ladder-user-grid { margin-top: 12px; row-gap: 5px; align-items: start; }
    .ladder-user-stat { min-width: 0; margin: 0; padding-inline: 2px; text-align: center; }
    .ladder-user-stat + .ladder-user-stat { border-inline-start: 1px solid var(--line); }
    .ladder-user-stat dt { color: var(--muted); font-size: 13px; }
    .ladder-user-stat dd { margin: 1px 0 0; font-variant-numeric: tabular-nums; }
    .ladder-user-rank { font-size: 16px; font-weight: 750; }
    .ladder-user-tokens { color: var(--blue); font-size: 14px; font-weight: 650; overflow-wrap: anywhere; }
    .ladder-mine {
      min-width: 0; margin: 0; color: var(--purple); font-size: 24px; font-weight: 800; line-height: 1.25;
      letter-spacing: -.3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ladder-badges { grid-column: 1 / -1; }
    .ladder-badge-slot { display: grid; place-items: center; min-height: 48px; }
    .ladder-medal {
      position: relative; display: inline-block; flex-shrink: 0; width: 48px; height: 48px;
      filter: drop-shadow(0 1px 1px rgb(0 0 0 / 25%));
    }
    .ladder-medal-7 { --medal-phase: -1.2s; }
    .ladder-medal-30 { --medal-phase: -2.4s; }
    .ladder-medal[data-place="1"] {
      --medal-light: #fff3bc; --medal-mid: #e6b541; --medal-dark: #8b5515;
      --medal-face-light: #ffedb0; --medal-face-dark: #cf9b36;
      --medal-ink: #4c2e0c; --medal-sheen: rgb(255 249 217 / 95%);
    }
    .ladder-medal[data-place="2"] {
      --medal-light: #f6f9fc; --medal-mid: #bac5d0; --medal-dark: #65727f;
      --medal-face-light: #edf3f9; --medal-face-dark: #a6b2bf;
      --medal-ink: #2e3947; --medal-sheen: rgb(243 250 255 / 85%);
    }
    .ladder-medal[data-place="3"] {
      --medal-light: #f9c9a0; --medal-mid: #c18356; --medal-dark: #794527;
      --medal-face-light: #f3c7a7; --medal-face-dark: #bb7952;
      --medal-ink: #44281a; --medal-sheen: rgb(255 230 204 / 76%);
    }
    .ladder-medal-crown {
      position: absolute; top: 1px; left: 13px; width: 22px; height: 13px;
      clip-path: polygon(0 25%, 24% 54%, 24% 7%, 41% 40%, 50% 0, 59% 40%, 76% 7%, 76% 54%, 100% 25%,
        85% 92%, 69% 100%, 31% 100%, 15% 92%);
      background: linear-gradient(180deg, transparent 68%, var(--medal-dark) 77%, var(--medal-light) 85%, var(--medal-mid) 95%),
        linear-gradient(107deg, var(--medal-dark), var(--medal-light) 23%, var(--medal-mid) 41%, var(--medal-light) 62%, var(--medal-dark));
    }
    .ladder-medal-branch { position: absolute; inset: 7px 4px 1px; }
    .ladder-medal-branch + .ladder-medal-branch { transform: scaleX(-1); }
    .ladder-medal-branch::before {
      content: ""; position: absolute; inset: 1px; border: 1px solid var(--medal-mid); border-radius: 50%;
      clip-path: polygon(50% 50%, 0 1%, 0 100%, 53% 100%);
    }
    .ladder-medal-branch::after {
      content: ""; position: absolute; left: 43%; bottom: 1.5px; width: 7px; height: 1px;
      background: var(--medal-mid); transform: rotate(21deg);
    }
    .ladder-medal-leaf {
      position: absolute; top: 50%; left: 50%;
      transform: rotate(var(--leaf-angle)) translateY(19px);
    }
    .ladder-medal-leaf::before, .ladder-medal-leaf::after {
      content: ""; position: absolute; top: -1.5px; right: -.5px; width: 6px; height: 3px;
      border-radius: 85% 5% 85% 5%; transform-origin: right center;
      background: linear-gradient(160deg, var(--medal-light), var(--medal-mid) 56%, var(--medal-dark));
    }
    .ladder-medal-leaf::before { transform: rotate(-33deg); }
    .ladder-medal-leaf::after { transform: rotate(44deg) scale(.9); }
    .ladder-medal-emblem {
      position: absolute; top: 14px; left: 10px; width: 28px; height: 28px; display: grid; padding: 2.5px;
      overflow: hidden; border-radius: 50%; box-shadow: 0 0 0 .5px var(--medal-dark);
      background: conic-gradient(from -30deg, var(--medal-light), var(--medal-dark) 28%, var(--medal-light) 48%,
        var(--medal-dark) 69%, var(--medal-mid) 83%, var(--medal-light));
    }
    .ladder-medal-emblem::before {
      content: ""; position: absolute; inset-block: 0; left: 0; width: 48%; pointer-events: none;
      background: linear-gradient(90deg, transparent, var(--medal-sheen) 45%, var(--medal-light) 52%, transparent);
      animation: medal-sweep 3.6s ease-in-out var(--medal-phase, 0s) infinite;
    }
    .ladder-medal-mark {
      position: relative; display: grid; place-items: center; border-radius: 50%;
      background: linear-gradient(150deg, var(--medal-face-light) 20%, var(--medal-face-dark) 85%);
      box-shadow: 0 0 0 .5px var(--medal-dark), inset 0 .75px 0 var(--medal-light);
      color: var(--medal-ink); font: 700 14px/1 Georgia, serif; font-variant-numeric: lining-nums tabular-nums;
      text-shadow: 0 .75px 0 var(--medal-light);
    }
    .ladder-medal::before, .ladder-medal::after {
      content: ""; position: absolute; z-index: 1; opacity: 0; pointer-events: none;
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      background: radial-gradient(circle, var(--medal-light), var(--medal-sheen));
      animation: medal-twinkle 3.6s ease-in-out var(--medal-phase, 0s) infinite;
    }
    .ladder-medal::before { left: 9px; top: 13px; width: 10px; height: 10px; }
    .ladder-medal::after {
      right: 8px; top: 31px; width: 8px; height: 8px;
      animation-delay: calc(var(--medal-phase, 0s) + .55s);
    }
    @keyframes medal-sweep {
      0%, 34% { transform: translateX(-160%) skewX(-22deg); }
      74%, 100% { transform: translateX(280%) skewX(-22deg); }
    }
    @keyframes medal-twinkle {
      0%, 37%, 66%, 100% { opacity: 0; transform: scale(.35); }
      50% { opacity: 1; transform: scale(1); }
    }
    .ladder-title-actions { display: flex; align-items: center; gap: 6px; }
    .ladder-refresh { width: 28px; min-height: 28px; padding: 0; border-radius: 9px; }
    .ladder-preview { padding: 9px 11px; border-radius: 13px; background: var(--button-bg); }
    .ladder-preview p { margin: 0 0 6px; }
    .ladder-preview .ladder-note { margin-bottom: 8px; }
    .ladder-upload { margin-top: 7px; }
    .ladder-upload-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
    .ladder-confirmation { margin-top: 8px; }
    .ladder-upload-feedback {
      display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px; align-items: baseline;
      font-variant-numeric: tabular-nums;
    }
    .ladder-upload-result { text-align: right; overflow-wrap: anywhere; }
    .ladder-upload-result[data-result="success"] { color: var(--green); }
    .ladder-upload-result[data-result="failure"] { color: var(--error); }
    .ladder-rows { margin: 6px 0 0; padding: 0; list-style: none; }
    .ladder-rows:empty { margin: 0; }
    .ladder-rows li {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-areas: "rank name total" "rank time total";
      column-gap: 8px; align-items: center; padding: 8px 0;
      border-top: 1px solid var(--line); font-variant-numeric: tabular-nums;
    }
    .ladder-rank {
      grid-area: rank; min-width: 3ch; padding: 4px; border-radius: 9px; text-align: center;
      background: var(--tag-bg); color: var(--muted); font-size: 11px; font-weight: 700;
    }
    .ladder-self .ladder-rank { background: var(--button-bg); color: var(--blue); }
    .ladder-row-user { grid-area: name; display: flex; gap: 4px; align-items: center; min-width: 0; }
    .ladder-row-user .ladder-medal { zoom: .85; }
    .ladder-name { min-width: 0; color: var(--purple); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ladder-total {
      grid-area: total; padding: 4px 8px; border-radius: 11px; background: var(--button-bg); color: var(--blue);
      font-size: 14px; font-weight: 750; text-align: end; overflow-wrap: anywhere; max-width: 15ch;
    }
    .ladder-time { grid-area: time; color: var(--muted); font-size: 11px; }
    .ladder-interval { width: 4.25rem; min-height: 34px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: var(--surface); font: inherit; }
    .ladder-field, .ladder-switch { display: inline-flex; align-items: center; gap: 5px; }
    .ladder-switch { font-weight: 650; }
    .ladder-switch input { margin: 0; accent-color: var(--blue); }
    .ladder-interval:focus-visible, .ladder-switch input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .refresh.is-busy svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .messages:empty { display: none; }
    .message { margin-top: 12px; padding: 11px 13px; border-radius: 14px; overflow-wrap: anywhere; font-size: 12px; }
    .message-error { color: var(--error); background: var(--error-bg); }
    .message-warning { color: var(--orange); background: var(--warning-bg); }
    .loading { margin: 12px 2px 0; color: var(--muted); font-size: 12px; }
    .records { display: grid; gap: 8px; margin: 12px 0 0; padding: 0; list-style: none; }
    .record-card, .war, .heat, .ladder-card { min-width: 0; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); }
    .record-card { padding: 10px 16px; }
    .card-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; }
    .identity { min-width: 0; }
    .agent { margin: 0 0 1px 25px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 10.5px; font-weight: 600; letter-spacing: .02em; line-height: 1.4; }
    .model-line { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .model-icon { flex-shrink: 0; width: 20px; text-align: center; font-size: 16px; }
    .model { min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--purple); font-size: 13px; line-height: 1.6; font-weight: 700; }
    .badge { flex-shrink: 0; padding: 1px 6px; border-radius: 999px; background: var(--tag-bg); color: var(--muted); font-size: 10px; font-weight: 600; line-height: 1.4; }
    .badge-proxy { background: var(--proxy-bg); color: var(--green); }
    .meta-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 5px; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .timestamp { overflow-wrap: anywhere; }
    .ttft { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .speed { display: inline-flex; align-items: baseline; justify-content: center; gap: 4px; min-width: 0; padding: 6px 10px; border-radius: 15px; background: var(--speed-bg); color: var(--speed); white-space: nowrap; }
    .rocket { width: 16px; height: 16px; flex-shrink: 0; align-self: center; }
    .speed-value { min-width: 0; font-size: 20px; font-weight: 750; line-height: 1.15; letter-spacing: -.6px; }
    .speed-unit { font-size: 11px; font-weight: 550; line-height: 1; }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 8px 0 0; padding-top: 7px; border-top: 1px solid var(--line); }
    .metric { display: flex; flex-direction: column; min-width: 0; }
    .metric-label { margin: 0 0 3px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .metric-label span[aria-hidden] { margin-inline-end: 3px; font-size: 12px; }
    .metric-value-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 1px 3px; min-width: 0; margin: auto 0 0; }
    .metric-value { min-width: 0; max-width: 100%; font-size: 16px; line-height: 1.25; font-weight: 650; letter-spacing: -.3px; overflow-wrap: anywhere; }
    .metric-unit { color: var(--muted); font-size: 10px; }
    .output { color: var(--blue); }
    .duration { color: var(--green); }
    .cache { color: var(--cache); }
    .speed-value, .metric-value { font-variant-numeric: tabular-nums; }
    .metric-value.is-long { font-size: 14px; letter-spacing: -.4px; }
    .metric-value.is-very-long { font-size: 12px; }
    .speed-value.is-long { font-size: 16px; }
    .speed-value.is-very-long { font-size: 14px; }
    .empty { margin-top: 16px; padding: 28px 18px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); text-align: center; }
    .empty-icon { font-size: 26px; }
    .empty-text { margin: 10px 0 0; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .war, .heat { padding: 10px 16px; }
    .war-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 13px; background: var(--speed-bg); }
    .war-tab { min-width: 0; padding: 5px 4px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 650; cursor: pointer; }
    .war-tab[aria-selected="true"], .war-tab[aria-pressed="true"] { background: var(--button-bg); color: var(--blue); }
    .war-tab:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .war-totals { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 10px; margin-top: 10px; }
    .war-stat { min-width: 0; padding: 7px 9px; border-radius: 13px; background: var(--speed-bg); }
    .war-label { display: block; color: var(--muted); font-size: 11px; }
    .war-value { display: block; margin-top: 2px; font-size: 20px; line-height: 1.2; font-weight: 750; letter-spacing: -.3px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .war-value.tokens { color: var(--blue); }
    .war-value.requests { color: var(--green); }
    .war-value small { margin-inline-start: 3px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0; }
    .war-note { margin: 8px 0 0; color: var(--muted); font-size: 11px; }
    .war-note:empty, .war-note[hidden] { display: none; }
    .war-rows { margin: 6px 0 0; padding: 0; list-style: none; }
    .war-row { padding: 8px 2px 7px; border-top: 1px solid var(--line); }
    .war-row:first-child { border-top: 0; }
    .war-row-head { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .war-agent { flex-shrink: 0; padding: 1px 6px; border-radius: 999px; background: var(--tag-bg); color: var(--muted); font-size: 10px; font-weight: 600; line-height: 1.5; white-space: nowrap; }
    .war-model { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--purple); font-size: 13px; font-weight: 700; }
    .war-amount { flex-shrink: 0; color: var(--blue); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .war-track { height: 4px; margin: 6px 0 4px; border-radius: 2px; background: var(--tag-bg); overflow: hidden; }
    .war-fill { height: 100%; border-radius: 2px; background: var(--blue); }
    .war-meta { display: flex; flex-wrap: wrap; gap: 0 10px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .war-meta span { white-space: nowrap; }
    .war-empty { margin: 10px 2px 2px; color: var(--muted); font-size: 12px; text-align: center; }
    .war-empty[hidden] { display: none; }
    .rank-index { flex-shrink: 0; min-width: 14px; color: var(--muted); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .rank-tps { flex-shrink: 0; padding: 3px 7px; border-radius: 10px; color: var(--speed); background: var(--speed-bg); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
    #speed .war-fill { background: var(--speed); }
    .heat { position: relative; }
    .heat-scroll { direction: ltr; margin: 8px -4px 0; padding: 0 4px 4px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
    .heat-canvas { position: relative; }
    .heat-months { position: relative; height: 13px; color: var(--muted); font-size: 9px; }
    .heat-months span { position: absolute; top: 0; white-space: nowrap; }
    .heat-grid { display: grid; grid-template-rows: repeat(7, 8px); grid-auto-flow: column; grid-auto-columns: 8px; gap: 2px; }
    .heat-cell { width: 8px; height: 8px; border-radius: 2px; background: var(--heat-0); }
    .heat-cell.lv1 { background: var(--heat-1); }
    .heat-cell.lv2 { background: var(--heat-2); }
    .heat-cell.lv3 { background: var(--heat-3); }
    .heat-cell.lv4 { background: var(--heat-4); }
    .heat-cell.future { visibility: hidden; }
    .heat-cell:hover { outline: 1px solid var(--blue); outline-offset: 0; }
    .heat-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; color: var(--muted); font-size: 10px; }
    .heat-legend { display: inline-flex; align-items: center; gap: 3px; }
    .heat-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; }
    .heat-legend .lv0 { background: var(--heat-0); }
    .heat-legend .lv1 { background: var(--heat-1); }
    .heat-legend .lv2 { background: var(--heat-2); }
    .heat-legend .lv3 { background: var(--heat-3); }
    .heat-legend .lv4 { background: var(--heat-4); }
    .heat-tip { position: absolute; z-index: 5; max-width: 240px; padding: 5px 8px; border-radius: 8px; background: var(--ink); color: var(--surface); font-size: 11px; line-height: 1.4; white-space: nowrap; pointer-events: none; transform: translate(-50%, -100%); box-shadow: var(--shadow); }
    .heat-tip[hidden] { display: none; }
    .footer { margin: 15px 2px 0; color: var(--muted); font-size: 10px; line-height: 1.7; }
    .footer p { margin: 0; }
    @media (max-width: 339px) {
      .metrics { gap: 6px; }
      .card-top { gap: 8px; }
      .model { font-size: 12px; }
      .agent { font-size: 10px; }
      .speed { padding: 5px 8px; gap: 3px; }
      .speed-value { font-size: 17px; }
      .war, .heat, .ladder-card { padding-inline: 12px; }
      .ladder-mine { font-size: 22px; }
      .ladder-user-grid, .ladder-badges { column-gap: 2px; }
      .ladder-user-stat { padding-inline: 0; }
      .war-totals { gap: 6px; }
      .war-value { font-size: 17px; }
      .ladder-total { padding-inline: 6px; font-size: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .refresh.is-busy svg { animation: none; }
      .refresh:active:not(:disabled) { transform: none; }
      .ladder-medal::before, .ladder-medal::after, .ladder-medal-emblem::before { animation: none; opacity: 0; }
    }
  </style>
</head>
<body>

  <script>
    const locale = (() => {
      const bridge = window.orca?.plugin;
      const byId = id => document.getElementById(id);
      const picker = byId('language-picker'), toggle = byId('language-toggle'), menu = byId('language-menu');
      const search = byId('language-search'), list = byId('language-options'), message = byId('language-message');
      let code = 'en', strings = {}, options = [], saving = false;
      const formatters = new Map();
      const t = (key, ...values) => strings[key]?.replace(/\{(\d+)\}/g, (_, index) => values[index] ?? '') ?? '';
      const normalize = value => value.normalize('NFKD').replace(/\p{M}/gu, '').toLocaleLowerCase().trim();
      const englishNames = new Intl.DisplayNames('en', { type: 'language' });
      const chineseNames = new Intl.DisplayNames('zh-CN', { type: 'language' });

      function messageText(key) {
        message.hidden = !key;
        message.textContent = key ? t(key) : '';
      }

      function renderOptions() {
        const query = normalize(search.value);
        const names = new Intl.DisplayNames(code, { type: 'language' });
        const matches = options.filter(option => [
          option.name, option.code, englishNames.of(option.code), chineseNames.of(option.code), names.of(option.code)
        ].some(value => normalize(value).includes(query)));
        list.replaceChildren(...matches.map(option => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'language-option';
          button.dataset.locale = option.code;
          button.setAttribute('aria-pressed', String(option.code === code));
          button.disabled = saving;
          const flag = document.createElement('img');
          flag.className = 'language-flag';
          flag.src = option.flag;
          flag.alt = '';
          const name = document.createElement('bdi');
          name.className = 'language-name';
          name.lang = option.code;
          name.textContent = option.name;
          button.append(flag, name);
          return button;
        }));
        messageText(matches.length ? '' : 'no-matching-languages');
      }

      function apply({ code: selected, strings: dictionary, options: choices }) {
        code = selected;
        strings = dictionary;
        if (choices) options = choices;
        formatters.clear();
        document.documentElement.lang = code;
        for (const root of [document, byId('record-template').content]) {
          for (const element of root.querySelectorAll('[data-i18n]')) element.textContent = t(element.dataset.i18n);
          for (const attribute of ['aria-label', 'title', 'placeholder']) {
            for (const element of root.querySelectorAll(`[data-i18n-${attribute}]`)) {
              element.setAttribute(attribute, t(element.getAttribute(`data-i18n-${attribute}`)));
            }
          }
        }
        const selectedOption = options.find(option => option.code === code);
        if (selectedOption) {
          byId('language-flag').src = selectedOption.flag;
          const name = byId('language-name');
          name.lang = code;
          name.textContent = selectedOption.name;
          toggle.setAttribute('aria-label', t('choose-language', selectedOption.name));
          picker.hidden = false;
        }
        document.dispatchEvent(new Event('tps-language-changed'));
      }

      function setOpen(open, restoreFocus = false) {
        menu.hidden = !open;
        toggle.setAttribute('aria-expanded', String(open));
        if (open) {
          search.value = '';
          renderOptions();
          search.focus();
        } else if (restoreFocus) toggle.focus();
      }

      async function select(selected) {

        const pendingRevision = revision;
        busy = true;
        problem = null;
        render();
        try {
          const next = await bridge.request(name, undefined, { signal: lifetime.signal, timeoutMs: 30000 });
          if (!disposed && pendingRevision === revision) accept(next, 'request');
        } catch {
          if (!disposed && pendingRevision === revision) problem = 'current-read-failed';
        } finally {
          if (!disposed) { busy = false; render(); }
        }
      }
      function refresh() { void request('tps.refresh'); }
      function cleanup() {
        if (disposed) return;
        disposed = true;
        lifetime.abort();
        ui.refresh.removeEventListener('click', refresh);
        for (const subscription of subscriptions) subscription?.dispose();
        clearInterval(usageTimer);
      }
      ui.refresh.addEventListener('click', refresh);
      document.addEventListener('tps-language-changed', () => {
        drawnRecords = '';
        heatTip.hidden = true;
        render();
        renderUsage();
      }, { signal: lifetime.signal });
      window.addEventListener('pagehide', cleanup, { once: true });
      if (bridge && typeof bridge.request === 'function' && typeof bridge.on === 'function') {
        subscriptions.push(bridge.on('tps.changed', next => {
          if (!disposed && accept(next, 'push')) { revision += 1; render(); }
        }));
        if (typeof window.orca.on === 'function') {
          subscriptions.push(window.orca.on('theme', theme => {
            if (disposed || !['light', 'dark'].includes(theme?.colorScheme)) return;
            document.documentElement.classList.remove('light', 'dark');
            document.documentElement.classList.add(theme.colorScheme);
          }));
        }
        void request('tps.state');
        void loadUsage();
        usageTimer = setInterval(() => void loadUsage(), USAGE_REFRESH_MS);
      } else {
        problem = 'open-in-orca';
        render();
      }
    })();
  </script>
  <script>
    (() => {
      const bridge = window.orca?.plugin;
      const element = id => document.getElementById('ladder-' + id);
      const group = document.getElementById('leaderboard');
      const lifetime = new AbortController();
      const clock = time => locale.date(time, { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const shortClock = time => locale.date(time, { hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
      const boardDay = () => new Date(Date.now() + 8 * 60 * 60 * 1000).toISOString().slice(0, 10);
      const rankTabs = [...group.querySelectorAll('[data-rank-days]')];
      const periods = [
        { days: 1, mark: 'Ⅰ', title: 'today-period' }, { days: 7, mark: '7', title: 'seven-day-period' },
        { days: 30, mark: '30', title: 'thirty-day-period' }
      ];
      const podium = ['gold-medal', 'silver-medal', 'bronze-medal'];
      const messages = {
        unavailable: 'leaderboard-unavailable', github_unavailable: 'github-login-unavailable',
        login_required: 'login-required', banned: 'account-banned',
        installation_unavailable: 'installation-save-failed', upgrade_required: 'update-required',
        session_expired: 'session-expired',
        login_expired: 'login-expired', login_denied: 'github-login-denied',
        browser_unavailable: 'browser-unavailable', signed_in: 'signed-in-success', signed_out: 'signed-out-success',
        accepted: 'upload-accepted', duplicate: 'upload-duplicate',
        removed: 'score-removed', too_soon: 'upload-too-soon',
        upload_in_progress: 'upload-in-progress',
        locked: 'upload-locked',
        history_pending: 'preparing-upload-history', history_invalid: 'history-upload-invalid',
        new_day: 'new-ranking-day', usage_changed: 'usage-changed',
        usage_unready: 'usage-not-ready', invalid: 'upload-invalid',
        rate_limited: 'rate-limited', invalid_interval: 'invalid-upload-interval'
      };
      const messageFor = code => Object.hasOwn(messages, code) ? t(messages[code]) : undefined;
      let model, session, local, preview, pendingLogin, retryLogin, rankDays = 1;
      const cachedRankings = new Map(), refreshing = new Set();
      let busy = false, savingUpload = false, readingUsage = false, restoringSession = false, edited = false;
      let revision = 0, drawnRows = '', renderedDay = '', loginProblem = '', messageCode = '';
      let summaryAccount = '', summaryUpload = null;

      async function request(action, payload = {}) {
        try {
          return await bridge.request('tps.leaderboard', { action, days: rankDays, ...payload }, { signal: lifetime.signal, timeoutMs: 30000 });
        } catch {
          return { code: 'unavailable' };
        }
      }

      function medal(rank, period) {
        const place = podium[rank - 1];
        if (!place) return null;
        const badge = document.createElement('span');
        badge.className = 'ladder-medal ladder-medal-' + period.days;
        badge.dataset.place = rank;
        badge.title = t('medal-position', t(period.title), t(place));
        badge.setAttribute('role', 'img');
        badge.setAttribute('aria-label', badge.title);
        const crown = document.createElement('span'), branch = document.createElement('span');
        const emblem = document.createElement('span'), mark = document.createElement('span');
        crown.className = 'ladder-medal-crown';
        branch.className = 'ladder-medal-branch';
        for (let angle = 15; angle <= 135; angle += 20) {
          const leaf = document.createElement('span');
          leaf.className = 'ladder-medal-leaf';
          leaf.style.setProperty('--leaf-angle', `${angle}deg`);
          branch.append(leaf);
        }
        emblem.className = 'ladder-medal-emblem';
        mark.className = 'ladder-medal-mark';
        mark.textContent = period.mark;
        emblem.append(mark);
        badge.append(crown, branch, branch.cloneNode(true), emblem);
        return badge;
      }

      function renderRows(rows, username) {
        const signature = JSON.stringify([rankDays, username, rows]);
        if (signature === drawnRows) return;
        drawnRows = signature;
        const list = document.createDocumentFragment();
        const period = periods.find(entry => entry.days === rankDays);
        for (const row of rows) {
          const item = document.createElement('li');
          if (username && row.username === username) item.classList.add('ladder-self');
          const rank = document.createElement('span'), name = document.createElement('span'), user = document.createElement('div');
          const total = document.createElement('strong'), time = document.createElement('time');
          rank.className = 'ladder-rank';
          name.className = 'ladder-name';
          user.className = 'ladder-row-user';
          total.className = 'ladder-total';
          time.className = 'ladder-time';
          rank.textContent = locale.number(row.rank);
          name.textContent = row.username;
          name.dir = 'auto';
          name.title = row.username;
          user.append(name);
          const badge = medal(row.rank, period);
          if (badge) user.append(badge);
          total.textContent = formatTokenMB(row.tokens);
          const uploaded = clock(row.submittedAt);
          if (rankDays !== 1) time.setAttribute('data-localized-text', '');
          time.textContent = rankDays === 1 ? uploaded : t('last-upload-at', uploaded);
          time.dateTime = new Date(row.submittedAt).toISOString();
          item.append(rank, user, total, time);
          list.append(item);
        }
        element('rows').replaceChildren(list);
      }

      function renderAccount(username, account) {
        const identity = element('mine');
        identity.textContent = username || t('signed-in-label');
        identity.title = username ?? '';
        let hasMedals = false;
        for (const period of periods) {
          const ranking = cachedRankings.get(period.days);
          const row = username && ranking?.day === renderedDay ? ranking.rows.find(row => row.username === username) : null;
          const freshToday = period.days === 1 && account.day === renderedDay && account.submitted &&
            (!row || account.submittedAt >= row.submittedAt);
          const tokens = freshToday ? account.tokens : row?.tokens;
          element('user-rank-' + period.days).textContent = row ? t('rank-position', locale.number(row.rank)) : '—';
          element('user-tokens-' + period.days).textContent = formatTokenMB(tokens);
          const place = row?.rank >= 1 && row.rank <= podium.length ? row.rank : 0;
          if (place) hasMedals = true;
          const slot = element('user-badge-' + period.days);
          if (Number(slot.dataset.place ?? 0) === place) continue;
          slot.dataset.place = place;
          slot.querySelector('.ladder-medal')?.remove();
          if (place) slot.append(medal(place, period));
        }
        element('medals').hidden = !hasMedals;
      }

      function renderUpload(snapshot, signedIn, time) {
        const enabled = snapshot.upload?.enabled === true;
        const next = Math.ceil(((snapshot.nextAutomaticAt ?? 0) - time) / 1000);
        const countdown = element('upload-note');
        let text = t('auto-upload-off');
        if (!signedIn) text = t('login-to-upload');
        else if (snapshot.uploading || messageCode === 'upload_in_progress') text = t('uploading');
        else if (enabled) {
          if (next > 0) {
            const hours = Math.floor(next / 3600), minutes = Math.floor(next / 60) % 60, seconds = next % 60;
            const span = [minutes, seconds].map(value => locale.number(value, { minimumIntegerDigits: 2 })).join(':');
            text = t('auto-upload-countdown', (hours ? locale.number(hours) + ':' : '') + span);
          } else text = t('waiting-for-auto-upload');
        }
        if (countdown.textContent !== text) countdown.textContent = text;
        const log = element('upload-result'), record = signedIn ? snapshot.lastUpload : null;
        const success = ['accepted', 'initialized', 'duplicate'].includes(record?.code);
        log.hidden = !record;
        log.dataset.result = success ? 'success' : 'failure';
        const name = { automatic: t('automatic-upload'), manual: t('manual-upload'), history: t('history-upload') }[record?.kind] ?? t('upload');
        const detail = record?.code === 'initialized' ? t('completed') : success ? t('success') : t('upload-failed', messageFor(record?.code) ?? t('retry'));
        const fullOutcome = record ? t('upload-result-summary', clock(record.at), name, detail) : '';
        const outcome = success ? t('upload-result-short', name, detail, shortClock(record.at)) : fullOutcome;
        if (log.textContent !== outcome) log.textContent = outcome;
        const tooltip = success ? fullOutcome : '';
        if (log.title !== tooltip) log.title = tooltip;
      }

      function render(code = messageCode) {
        messageCode = code;
        renderedDay = boardDay();
        const time = Date.now();
        const { board = {} } = model ?? {};
        const snapshot = session ?? model ?? {};
        const { board: account = board, upload, sessionProblem, initializing, historyProblem } = snapshot;
        const selected = model?.days === rankDays;
        const readyBoard = board.day === renderedDay && Array.isArray(board.rows);
        const live = selected && readyBoard;
        const cached = cachedRankings.get(rankDays);
        const cachedRanking = cached?.day === renderedDay ? cached : null;
        const ranking = live ? board : cachedRanking;
        const freshness = element('freshness');
        const notice = !ranking && !(selected && board.code) ? t('loading-leaderboard') : '';
        if (freshness.textContent !== notice) freshness.textContent = notice;
        freshness.hidden = !notice;
        const refreshedAt = (live ? model.updatedAt : null) ?? cachedRanking?.updatedAt ?? null;
        const refreshTime = element('refresh-time');
        refreshTime.hidden = refreshedAt === null;
        if (refreshedAt !== null) {
          refreshTime.dateTime = new Date(refreshedAt).toISOString();
          refreshTime.title = clock(refreshedAt);
          refreshTime.textContent = t('leaderboard-refreshed-at', shortClock(refreshedAt));
        }
        const signedIn = snapshot.signedIn ?? account.authenticated;
        const checkingLogin = typeof signedIn !== 'boolean';
        element('controls').hidden = false;
        element('sign-in').hidden = checkingLogin || signedIn || Boolean(pendingLogin);
        element('login').disabled = busy;
        element('login-wait').hidden = !pendingLogin;
        element('account').hidden = !signedIn;
        const logoutNote = element('logout-pending');
        const logoutText = snapshot.logoutStorageFailed ? t('logout-storage-failed')
          : snapshot.logoutPending ? t('logout-pending') : '';
        if (logoutNote.textContent !== logoutText) logoutNote.textContent = logoutText;
        logoutNote.hidden = !logoutText;
        const boardProblem = selected ? messageFor(board.code) : undefined;
        const sessionStatus = checkingLogin ? t('checking-login') : '';
        const locked = account.lockedUntil > time, coolingDown = account.nextUploadAt > time;
        const authProblem = pendingLogin ? undefined : messageFor(sessionProblem);
        const actionMessage = code === 'upload_in_progress' || code === snapshot.lastUpload?.code ? undefined : messageFor(code);
        element('status').textContent = authProblem ?? actionMessage ?? messageFor(loginProblem) ??
          (account.banned ? messageFor('banned') : boardProblem) ??
          (locked ? messageFor('locked') : messageFor(historyProblem) ?? (initializing ? messageFor('history_pending') : sessionStatus));
        element('rank-title').textContent = rankDays === 1 ? t('daily-rank') : t('period-rankings');
        element('rows').setAttribute('aria-label', t(rankDays === 1 ? 'daily-usage-rankings' : 'period-rankings'));
        element('empty').textContent = rankDays === 1 ? t('empty-today') : t('empty-rankings');
        element('empty').hidden = !ranking || ranking.rows.length > 0;
        const username = signedIn ? account.username : '';
        renderRows(ranking?.rows ?? [], username);
        if (signedIn) renderAccount(username, account);
        else preview = undefined;
        const usageReady = local?.ready && local.day === renderedDay;
        const removed = account.day === renderedDay && account.submitted && account.tokens === null;
        const canSubmit = signedIn && usageReady && local.tokens > 0 && !locked && !removed;
        element('preview').hidden = Boolean(preview);
        element('preview').disabled = !canSubmit || coolingDown || busy || snapshot.uploading;
        element('confirmation').hidden = !canSubmit || !preview;
        if (preview) {
          const day = locale.date(new Date(preview.day + 'T00:00:00Z'), { dateStyle: 'medium', timeZone: 'UTC' });
          element('preview-text').textContent = t('preview-upload', day, formatTokenMB(preview.tokens));
        }
        element('submit').disabled = coolingDown || busy || snapshot.uploading;
        if (coolingDown && canSubmit && !code && !upload?.enabled) element('status').textContent = messageFor('too_soon');
        const enabled = upload?.enabled === true;
        element('upload-enabled').checked = enabled;
        element('upload-enabled').disabled = !signedIn || savingUpload;
        element('upload-interval').disabled = !signedIn || savingUpload;
        element('save-upload').disabled = !signedIn || savingUpload;
        if (!edited) element('upload-interval').value = upload?.interval ?? 60;
        renderUpload(snapshot, signedIn, time);
      }

      async function showCache(days = rankDays) {
        if (cachedRankings.get(days)?.day === boardDay()) return;
        const { ranking } = await request('cache', { days });
        if (lifetime.signal.aborted || !ranking || ranking.day !== boardDay()) return;
        const cachedRanking = cachedRankings.get(days);
        if (cachedRanking?.day === ranking.day && cachedRanking.updatedAt >= ranking.updatedAt) return;
        cachedRankings.set(days, ranking);
        if (!group.hidden) render();
      }

      async function refreshSession() {
        if (restoringSession || busy || savingUpload || lifetime.signal.aborted) return;
        restoringSession = true;
        const requestedAt = revision;
        try {
          const result = await request('session');
          if (lifetime.signal.aborted || revision !== requestedAt || typeof result.signedIn !== 'boolean') return;
          session = result;
          render();
          void refreshUsage();
        } finally { restoringSession = false; }
      }

      async function refreshUsage() {
        if (readingUsage || !(session ?? model)?.signedIn || lifetime.signal.aborted) return;
        readingUsage = true;
        try {
          const result = await request('usage');
          if (lifetime.signal.aborted || !result.local) return;
          local = result.local;
          if (preview && (local.day !== preview.day || local.tokens !== preview.tokens)) preview = undefined;
          if (!group.hidden) render();
        } finally { readingUsage = false; }
      }

      function cacheRanking(result, days) {
        const { board, updatedAt } = result;
        if (!Number.isSafeInteger(updatedAt) || board?.day !== boardDay() || !Array.isArray(board.rows)) return false;
        const rows = board.rows.map(({ rank, username, tokens, submittedAt }) => ({ rank, username, tokens, submittedAt }));
        cachedRankings.set(days, { day: board.day, rows, updatedAt });
        return true;
      }

      function showState(result, days = rankDays) {
        const wasSignedIn = (session ?? model)?.signedIn;
        model = result.board ? result : { ...model, days, board: { code: result.code } };
        if (typeof result.signedIn === 'boolean') session = result;
        cacheRanking(result, days);
        render(result.code ?? '');
        showSummaries();
        if (!wasSignedIn) void refreshUsage();
      }

      function showSummaries() {
        const current = session ?? model, name = current?.signedIn && current.board?.username;
        if (!name) { summaryAccount = ''; summaryUpload = null; return; }
        if (group.hidden) return;
        const day = boardDay(), key = day + '/' + name;
        const uploaded = current.lastUpload?.code === 'accepted' ? current.lastUpload.at : null;
        const first = summaryAccount !== key, justUploaded = !first && uploaded !== null && uploaded !== summaryUpload;
        if (!first && !justUploaded) return;
        summaryAccount = key;
        if (first || uploaded !== null) summaryUpload = uploaded;
        for (const { days } of periods) {
          if (days === rankDays) continue;
          if (justUploaded) void refresh(days);
          else void showCache(days).then(() => {
            if (summaryAccount === key && cachedRankings.get(days)?.day !== day) void refresh(days);
          });
        }
      }

      async function refresh(days = rankDays) {
        if (group.hidden || lifetime.signal.aborted) return;
        if (renderedDay !== boardDay()) render('');
        if (busy || savingUpload || refreshing.has(days)) return;
        const requestedAt = revision;
        refreshing.add(days);
        try {
          const result = await request('state', { days });
          if (lifetime.signal.aborted) return;
          if (days !== rankDays || revision !== requestedAt) {
            if (cacheRanking(result, days)) render();
          } else showState(result, days);
        } finally { refreshing.delete(days); }
      }

      function showCachedRanking() {
        render('');
        void showCache();
      }

      async function update(action, details) {
        if (busy) return;
        busy = true;
        const requestedAt = ++revision;
        if (action === 'logout') {
          edited = false;
          preview = undefined;
          pendingLogin = undefined;
          loginProblem = '';
          clearTimeout(retryLogin);
        }
        if (action === 'submit') render('upload_in_progress');
        try {
          const result = await request(action, details);
          busy = false;
          if (result.board && (revision === requestedAt || result.code === 'signed_out')) showState(result);
          else render(result.code);
          if (result.code === 'signed_out') void refresh();
        } finally { busy = false; }
      }

      async function updateUpload(enabled, interval) {
        if (savingUpload) return;
        savingUpload = true;
        revision++;
        try {
          const result = await request('upload', { enabled, interval });
          if (typeof result.signedIn === 'boolean') session = result;
          savingUpload = false;
          render(result.code);
        } finally { savingUpload = false; }
      }

      async function poll() {
        if (!pendingLogin || lifetime.signal.aborted) return;
        const attempt = pendingLogin;
        const result = await request('poll');
        if (attempt !== pendingLogin || lifetime.signal.aborted) return;
        if (['pending', 'unavailable', 'rate_limited'].includes(result.code) && Date.now() < attempt.expiresAt) {
          if (result.code !== 'pending') render(result.code);
          retryLogin = setTimeout(poll, attempt.interval);
          return;
        }
        revision++;
        pendingLogin = undefined;
        if (result.code === 'signed_in') {
          showState(result);
          void refresh();
        } else {
          loginProblem = Date.now() >= attempt.expiresAt ? 'login_expired' : result.code;
          render(loginProblem);
        }
      }

      if (!bridge?.request) return;
      for (const tab of rankTabs) tab.addEventListener('click', () => {
        const days = Number(tab.dataset.rankDays);
        if (days === rankDays) return;
        rankDays = days;
        for (const tab of rankTabs) tab.setAttribute('aria-pressed', String(Number(tab.dataset.rankDays) === days));
        showCachedRanking();
      });
      group.addEventListener('tps-view-opened', showCachedRanking);
      document.addEventListener('tps-language-changed', () => {
        drawnRows = '';
        for (const { days } of periods) delete element('user-badge-' + days).dataset.place;
        render();
      }, { signal: lifetime.signal });
      element('update').addEventListener('click', async () => {
        const button = element('update');
        button.classList.add('is-busy');
        try { await refresh(); } finally { button.classList.remove('is-busy'); }
      });
      element('login').addEventListener('click', async () => {
        if (busy || pendingLogin) return;
        busy = true;
        revision++;
        loginProblem = '';
        let attempt;
        render('');
        try {
          const draft = await request('login');
          if (lifetime.signal.aborted) return;
          if (!draft.loginUrl) {
            loginProblem = draft.code ?? 'unavailable';
            render(loginProblem);
            return;
          }
          attempt = { ...draft, expiresAt: Date.now() + draft.timeout };
          pendingLogin = attempt;
          render('');
          const result = await window.orca.shell.openExternal(attempt.loginUrl);
          if (pendingLogin !== attempt) return;
          if (result?.opened) {
            retryLogin = setTimeout(poll, attempt.interval);
            return;
          }
          pendingLogin = undefined;
          loginProblem = 'browser_unavailable';
          render(loginProblem);
        } catch {
          if (pendingLogin !== attempt) return;
          pendingLogin = undefined;
          loginProblem = 'browser_unavailable';
          render(loginProblem);
        } finally {
          busy = false;
          if (!lifetime.signal.aborted) render();
        }
      });
      element('stop-login').addEventListener('click', async () => {
        revision++;
        const attempt = pendingLogin;
        pendingLogin = undefined;
        loginProblem = '';
        clearTimeout(retryLogin);
        render('');
        if (attempt) await request('cancel', { loginUrl: attempt.loginUrl });
      });
      element('logout').addEventListener('click', () => void update('logout'));
      element('preview').addEventListener('click', () => {
        if (!local?.ready || local.day !== boardDay()) return;
        preview = local;
        render('');
      });
      element('cancel').addEventListener('click', () => { preview = undefined; render(''); });
      element('submit').addEventListener('click', () => {
        if (busy || !preview) return;
        const { day, tokens } = preview;
        preview = undefined;
        void update('submit', { day, tokens });
      });
      const uploadInterval = element('upload-interval');
      const uploadEnabled = element('upload-enabled');
      uploadInterval.addEventListener('input', () => { edited = true; });
      uploadEnabled.addEventListener('change', () => {
        if (uploadEnabled.checked && !uploadInterval.reportValidity()) {
          uploadEnabled.checked = false;
          return;
        }
        const seconds = uploadInterval.validity.valid ? uploadInterval.valueAsNumber : model?.upload?.interval ?? 60;
        edited = false;
        void updateUpload(uploadEnabled.checked, seconds);
      });
      element('upload-form').addEventListener('submit', event => {
        event.preventDefault();
        edited = false;
        void updateUpload(uploadEnabled.checked, uploadInterval.valueAsNumber);
      });
      void refreshSession();
      for (const { days } of periods) void showCache(days);
      const interval = setInterval(() => {
        if (group.hidden) return;
        void refresh();
        void refreshSession();
      }, 1000);
      window.addEventListener('pagehide', () => {
        lifetime.abort();
        clearTimeout(retryLogin);
        clearInterval(interval);
      }, { once: true });
    })();
  </script>
</body>
</html>
